# 持續整合：每次 push 與 pull request 都跑一次
# 1. 靜態檢查（ESLint）、引擎測試（node test/levels.test.mjs）與建置（vite build）
# 2. 瀏覽器端測試（Playwright）：GitHub 的 ubuntu-latest 已經裝好 Google Chrome，
#    playwright.config.mjs 用 channel: 'chrome'，不用另外下載瀏覽器
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: 引擎測試與建置
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:artifact

  browser:
    name: 瀏覽器端測試
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright test
      - name: 失敗時保留截圖與 trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: e2e/.results
          retention-days: 7
